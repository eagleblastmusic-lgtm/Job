name: FARO Canonical

on:
  push:
    branches: [main, "codex/faro-**", "codex/faro-canonical"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:migrations
      - name: Canonical invariants and reused authentication/security contracts
        run: npm run test:faro
      - name: Real-file Canonical erasure and authority recovery
        run: node scripts/faro-backup-restore-exercise.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Both roles and retained public accessibility contracts, desktop/mobile
        run: npm run test:browser:faro
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: faro-browser-failures
          path: test-results/
          retention-days: 7
  compatibility-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y python3-reportlab fonts-dejavu-core poppler-utils unzip
      - run: npm ci --no-audit --no-fund
      - name: All retained Node modules and Canonical tests (no skips)
        run: npm test
      - name: Historical storage compatibility rehearsal
        run: node scripts/backup-restore-exercise.mjs
      - name: Build actual production image
        run: docker build -t faro-canonical:${{ github.sha }} .
      - name: Isolated image readiness and closed-release boundary
        run: |
          docker run -d --name faro-canonical -p 3000:3000 -e APP_ORIGIN=http://127.0.0.1:3000 faro-canonical:${{ github.sha }}
          trap 'docker logs faro-canonical; docker rm -f faro-canonical >/dev/null 2>&1 || true' EXIT
          node scripts/faro-container-smoke.mjs --base http://127.0.0.1:3000

  postgres-rehearsal:
    name: PostgreSQL staging counts, hashes, constraints and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: faro_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: faro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faro_test -d faro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Authenticated private backup artifact regression
        run: node --test scripts/faro-backup-envelope.test.mjs
      - name: Import synthetic offline snapshot into real PostgreSQL and verify it
        run: npm run verify:postgres:rehearsal
        env:
          FARO_PG_REHEARSAL_URL: postgres://faro_test:synthetic-ci-only@127.0.0.1:5432/faro_test
      - name: Install real Chromium for PostgreSQL browser acceptance
        run: npx playwright install --with-deps chromium
      - name: All existing canonical workspace browser contracts on PostgreSQL, desktop/mobile
        run: npx playwright test e2e/faro.spec.ts e2e/faro-employment.spec.ts e2e/faro-session.spec.ts e2e/faro-mfa.spec.ts e2e/faro-open-answer.spec.ts e2e/faro-incidents.spec.ts e2e/faro-restrictions.spec.ts e2e/browser.spec.ts
        env:
          FARO_PG_BROWSER: '1'
          FARO_PG_REHEARSAL_URL: postgres://faro_test:synthetic-ci-only@127.0.0.1:5432/faro_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: faro-postgres-browser-failures-${{ matrix.node }}
          path: test-results/
          retention-days: 7
