name: CI

on:
  push:
    branches: [main, "implementation/**", "codex/faro-canonical"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y python3-reportlab fonts-dejavu-core poppler-utils unzip
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:migrations
      - run: npm test
      - name: Backup and restore portability exercise
        run: npm run verify:backup-restore
      - name: Canonical erasure and authority recovery exercise
        run: node scripts/faro-backup-restore-exercise.mjs
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Canonical and retained public browser contracts — mobile and desktop
        run: npm run test:browser
      - name: Build production container
        run: docker build -t job-mvp:${{ github.sha }} .
      - name: Production container smoke test
        run: |
          docker run -d --name job-mvp -p 3000:3000 -e APP_ORIGIN=http://127.0.0.1:3000 job-mvp:${{ github.sha }}
          trap 'docker logs job-mvp; docker rm -f job-mvp >/dev/null 2>&1 || true' EXIT
          node scripts/faro-container-smoke.mjs --base http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
